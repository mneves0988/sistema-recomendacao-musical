name: SoundGraph smoke test

on:
  workflow_dispatch:
  schedule:
    # 23:17, 07:17, 15:17 BRT. UTC schedule; GitHub can delay runs.
    - cron: '17 2,10,18 * * *'

permissions:
  contents: read

concurrency:
  group: soundgraph-public-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04 # Playwright 1.55 supports Noble; ubuntu-latest moved to 26.04
    timeout-minutes: 15
    steps:
      - name: Check monitoring window
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || [[ $(date -u +%s) -lt $(date -u -d '2026-12-02 03:00:00' +%s) ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Monitoring period ended; no public requests will be made."
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.active == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.window.outputs.active == 'true'
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        if: steps.window.outputs.active == 'true'
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Verify public app and live recommendation
        if: steps.window.outputs.active == 'true'
        run: python monitoring/smoke_test.py
